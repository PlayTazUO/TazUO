visualeffects_rulefilter=Match when
; Chat trigger parameters
overlaytrigger_chat_casesensitive=Case sensitive
overlaytrigger_chat_casesensitive_tooltip=Match capitalisation exactly. Applies to every match mode,\nregular expressions included. Off by default:\nwhat the server sends is rarely capitalised the way\nyou would type it.
overlaytrigger_chat_duration=Duration (s)
overlaytrigger_chat_duration_tooltip=How long the effect runs for after a match,\nin seconds. A message has no length of its own,\nso this is the only thing that decides when the effect ends.
overlaytrigger_chat_fromplayeronly=From the player only
overlaytrigger_chat_fromplayeronly_tooltip=Match only lines the player character spoke,\nnot every line on screen.
overlaytrigger_chat_mode=Match
overlaytrigger_chat_mode_tooltip=How the pattern is compared against the line.\nRegex takes a .NET regular expression;\nthe rest are plain text.
overlaytrigger_chat_pattern=Pattern
overlaytrigger_chat_pattern_tooltip=The text, or regular expression, to look for in each line.
overlaytrigger_sound_index=Play on sound
overlaytrigger_sound_index_tooltip=The sound that sets this effect off.\nPick one by name, or type its number if it has none.\nPress Play to hear the current choice.
overlaytrigger_sound_number_tooltip=The sound's number in the client's data.\nType one here for a sound the list has no name for.
overlaytrigger_sound_play=Play
overlaytrigger_sound_play_tooltip=Hear the chosen sound.
overlaytrigger_sound_mindistance=Ignore closer than (tiles)
overlaytrigger_sound_mindistance_tooltip=Sounds nearer than this are ignored.\nUse it for an effect that should only answer to distant events.\nLeave at 0 to include sounds right beside you.
overlaytrigger_sound_maxdistance=Ignore further than (tiles)
overlaytrigger_sound_maxdistance_tooltip=Sounds beyond this are ignored.\nLeave at 0 to match how far you can hear.
overlaytrigger_sound_curve=Fade with distance
overlaytrigger_sound_curve_tooltip=How much weaker the effect gets as the sound gets further away.
overlaytrigger_sound_maxintensity=Strength when closest
overlaytrigger_sound_maxintensity_tooltip=Strength for a sound as close as it can get, from 0 to 1.\nSet it below the furthest strength to invert the effect.
overlaytrigger_sound_minintensity=Strength when furthest
overlaytrigger_sound_minintensity_tooltip=Strength for a sound at the edge of the range, from 0 to 1.\nScales the effect's own settings rather than replacing them.
overlaytrigger_sound_duration=Lasts for (seconds)
overlaytrigger_sound_duration_tooltip=How long the effect stays on screen after the sound plays.\nHearing the sound again restarts the clock.
falloff_flat=None
falloff_flat_tooltip=Distance changes nothing - everything in range is full strength
falloff_sqrt=Gentle
falloff_sqrt_tooltip=Starts high and fades slowly, staying strong to the edge
falloff_linear=Even
falloff_linear_tooltip=Fades evenly - halfway out is half strength
falloff_quadratic=Steep
falloff_quadratic_tooltip=Starts high and fades quickly
falloff_cubic=Very steep
falloff_cubic_tooltip=Fades almost at once - only the closest tiles register
falloff_custom=Custom
falloff_custom_tooltip=strength = nearness ^ power, where nearness runs 1 at the near edge to 0 at the far one.\nA power of 1 is Even, 2 is Steep, 3 is Very steep
falloff_power=Power
falloff_power_tooltip=The exponent nearness is raised to.\nAbove 1 concentrates strength near the player,\nbelow 1 spreads it towards the far edge.
; Layer composer - technique
visualeffects_layer_aberration=Separation
visualeffects_layer_aberration_tooltip=Red/blue separation, as a fraction of the distance\nfrom Shape.Center. Nothing separates at the centre and fringing\ngrows toward the corners.
visualeffects_layer_noise=Texture
visualeffects_layer_noise_tooltip=How the effect moves and what texture it has.
visualeffects_layer_pulse=Pulse
visualeffects_layer_pulse_tooltip=Time-varying swell of the layer's strength.
visualeffects_layer_radius=Radius
visualeffects_layer_radius_tooltip=Blur disk radius as a fraction of screen width.\nSmall values read as soft focus; past a couple of percent\nit becomes frosted glass.
visualeffects_layer_shape=Shape
visualeffects_layer_shape_tooltip=Where on screen the effect lives: vignette or border shape,\nhow far it extends, and how its boundary breaks up.
visualeffects_layer_strength=Strength
visualeffects_layer_strength_tooltip=Peak strength where the mask is full: a tint's alpha,\nor how far a distortion replaces the sharp frame.
visualeffects_layer_taps=Samples
visualeffects_layer_taps_radial_tooltip=Samples taken per pixel, and the whole cost of the layer.\nRadial needs fewer than a disk blur - its taps land on a line.
visualeffects_layer_taps_tooltip=Samples taken per pixel, and the whole cost of the layer.\nToo few for the radius shows as distinct ghost copies\ninstead of a blur.
visualeffects_layer_tint=Colour
visualeffects_layer_tint_tooltip=Colour of the layer.
visualeffects_layer_zoom=Zoom
visualeffects_layer_zoom_tooltip=How far along the centre ray the taps march,\nas a fraction of the distance from Shape.Center.\nThe centre stays sharp however high this goes.
; Layer composer - pulse
visualeffects_pulse_amplitude=Depth
visualeffects_pulse_amplitude_tooltip=Depth of that breathing, as a fraction of Strength.
visualeffects_pulse_frequency=Rate (Hz)
visualeffects_pulse_frequency_tooltip=Breathing rate in Hz. Hard-capped at 3 Hz for photosensitivity\nreasons.
; Layer composer - shape
visualeffects_shape_center=Centre
visualeffects_shape_center_tooltip=Centre of the radial falloff in screen uv. (0.5,\n0.5) is the middle.
visualeffects_shape_cornerbias=Corner weighting
visualeffects_shape_cornerbias_tooltip=Corner weighting of the border trim, ignored when EdgeBlend is 0.\nAt 0 the trim is a sharp-cornered rectangle;\nraising it thickens and rounds the corners.
visualeffects_shape_edgeblend=Vignette / border
visualeffects_shape_edgeblend_tooltip=0 = radial vignette, 1 = border trim.\nAvoid values in between: the radial term is width-normalised,\nso any blend lands mostly on the left and right edges.\nUse CornerBias for corner weighting.
visualeffects_shape_feather=Falloff
visualeffects_shape_feather_tooltip=Width of the fade behind the boundary. Wide thins the effect\ninto haze; narrow gives it a defined surface.
visualeffects_shape_focusamount=Bias strength
visualeffects_shape_focusamount_tooltip=0 = uniform all the way round, 1 = fully biased toward FocusDir.
visualeffects_shape_focusdir=Bias direction
visualeffects_shape_focusdir_tooltip=Unit vector biasing the effect toward one side or corner.
visualeffects_shape_focuspower=Bias tightness
visualeffects_shape_focuspower_tooltip=Higher values tighten the directional lobe.
visualeffects_shape_jitter=Boundary break-up
visualeffects_shape_jitter_tooltip=Breaks up the shape boundary with its own noise field.\nWithout it the effect ends along a straight iso-line and reads\nas a rectangle.
visualeffects_shape_reach=Reach
visualeffects_shape_reach_tooltip=How far in from the screen edge the effect extends.\nLarger is thicker.
visualeffects_shape_wobbleamp=Drift range
visualeffects_shape_wobbleamp_tooltip=Peak drift of the centre, in screen uv. Kept small -\nthis unsteadies the pivot rather than sending it touring\nthe screen.
visualeffects_shape_wobblefreq=Drift rate
visualeffects_shape_wobblefreq_tooltip=Rate the centre drifts at, in Hz per axis.\nDifferent X and Y values give a wander instead of a pendulum;\nzero on an axis holds it still.
; Layer composer - boundary break-up
visualeffects_jitter_channel=Flux source
visualeffects_jitter_channel_tooltip=Which packed noise channel drives the boundary displacement.
visualeffects_jitter_featheramount=Falloff flux
visualeffects_jitter_featheramount_tooltip=How much the same field stretches and compresses Feather.\nWithout it a deep run and a shallow one end just as abruptly.
visualeffects_jitter_reachamount=Boundary flux
visualeffects_jitter_reachamount_tooltip=How far the boundary can move,\nas a fraction of the shape distance. Only extends inward,\nso raising it raises average reach too -\ncompensate with Shape.Reach. Anything organic wants\nthis well above 0.
visualeffects_jitter_scale=Flux frequency
visualeffects_jitter_scale_tooltip=Frequency of the boundary displacement.\nMust be coarser than Noise.BaseScale or the edge just buzzes,\nbut X still has to cycle several times across the screen\nor each edge gets one gentle bulge and stays rectangular.
visualeffects_jitter_scroll=Flux drift
visualeffects_jitter_scroll_tooltip=Texture-space velocity of the displacement field.\nUsually matched to the layer's own scroll so the ragged edge\ntravels with the effect.
; Layer composer - texture
visualeffects_noise_basechannel=Primary source
visualeffects_noise_basechannel_tooltip=Which packed noise channel the primary field reads.\nR and G are fBm (organic); B is ridged and A is Worley -\nboth draw cell outlines and suit only cracks and shattering.
visualeffects_noise_basescale=Primary frequency
visualeffects_noise_basescale_tooltip=Frequency of the primary noise field.\nThe X:Y ratio is the anisotropy - near 1:1 reads as blobs,\n4:1 and beyond as streaks.
visualeffects_noise_basescroll=Primary drift
visualeffects_noise_basescroll_tooltip=Texture-space velocity. On-screen speed is Scroll / Scale,\nso two layers with matching scroll but different scales visibly\nslide against each other.
visualeffects_noise_detailchannel=Detail source
visualeffects_noise_detailchannel_tooltip=Which packed noise channel the secondary field reads.
visualeffects_noise_detailscale=Detail frequency
visualeffects_noise_detailscale_tooltip=Frequency of the secondary field, whose lookup is warped\nby the primary.
visualeffects_noise_detailscroll=Detail drift
visualeffects_noise_detailscroll_tooltip=Texture-space velocity of the secondary field.
visualeffects_noise_flatfloor=Solid fill
visualeffects_noise_flatfloor_tooltip=Solid fill blended under the noise. Anything above 0\nmakes the shape mask itself visible as a geometric form,\nso discrete streaks or wisps need exactly 0.\nNot a way to add weight.
visualeffects_noise_offset=Static offset
visualeffects_noise_offset_tooltip=Static texture-space shift of both fields, unaffected by time.\nUsed to desync a layer from another one sharing its scale\nand scroll, so they don't read as the same texture traced twice.
visualeffects_noise_ridgeamount=Ridging
visualeffects_noise_ridgeamount_tooltip=Outlines the field's median. Counterintuitive twice over: raising\nit makes the layer cover more, and what it draws are outlines,\nso on a soft field it produces bordered cells.
visualeffects_noise_softness=Edge softness
visualeffects_noise_softness_tooltip=Width of the fade either side of Threshold. Small gives hard-\nedged surfaces; large gives soft-edged clouds.
visualeffects_noise_threshold=Coverage cut-off
visualeffects_noise_threshold_tooltip=Cut-off applied to the field. Higher keeps less, so the layer gets\nsparser and its features narrower.
visualeffects_noise_warpstrength=Churn
visualeffects_noise_warpstrength_tooltip=How far the primary field displaces the secondary field's lookup.\nThe gas-versus-fluid dial: high values churn and billow,\nnear-zero lets the pattern translate coherently.
; Profile shake envelope
visualeffects_shake_curve=Easing
visualeffects_shake_curve_tooltip=Easing applied to both ramps.\nSmooth is the least mechanical; EaseIn holds then drops\nsharply, EaseOut moves off the peak at once.
visualeffects_shake_duration=Duration (s)
visualeffects_shake_duration_tooltip=Total length of the shake in seconds, ramps included.
visualeffects_shake_frequency=Rate (Hz)
visualeffects_shake_frequency_tooltip=Shake rate in Hz; zero uses the default.\nLower reads as a heavy rumble, higher as a rattle.
visualeffects_shake_independent=Shake is unaffected by the fade in/out settings
visualeffects_shake_rampdown=Ramp down (s)
visualeffects_shake_rampdown_tooltip=Seconds spent falling away at the end. Zero stops dead,\nwhich reads as a jolt. Set it to the whole duration for\nan impact that decays from the first frame.
visualeffects_shake_rampup=Ramp up (s)
visualeffects_shake_rampup_tooltip=Seconds spent building to full strength.\nZero starts at full amplitude on the first frame -\nright for an impact, wrong for anything that should be felt\napproaching.
visualeffects_shake_trauma=Strength
visualeffects_shake_trauma_tooltip=How far the screen moves at the peak, from 0 to 1,\nat full occurrence strength. 0.5 moves half as far as 1.
