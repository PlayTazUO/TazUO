name: Legacy Deploy (net472)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build (default: legacy)'
        required: true
        default: 'legacy'

env:
  CUO_OUTPUT_PATH: 'bin/dist'
  CUO_PROJECT_PATH: "src/ClassicUO.Client/ClassicUO.Client.csproj"
  CUO_ZIP_NAME: "TazUO.zip"

  DOTNET_NOLOGO: false
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  NUGET_XMLDOC_MODE: skip

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ inputs.branch || github.ref }}

    - name: Get submodules
      run: |
        git config --global url."https://".insteadOf git://
        git submodule update --init --recursive

    - name: Extract Version
      shell: bash
      run: |
        export LC_ALL=C.UTF-8
        echo "VERSION=$(grep -oP '<AssemblyVersion>\K\d+\.\d+\.\d+' src/ClassicUO.Client/ClassicUO.Client.csproj)" >> $GITHUB_ENV

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 8.0.x

    - name: Build
      run: dotnet publish ${{ env.CUO_PROJECT_PATH }} -c Release -o ${{ env.CUO_OUTPUT_PATH }}

    - name: Zip build
      uses: thedoctor0/zip-release@master
      with:
        type: 'zip'
        directory: ${{ env.CUO_OUTPUT_PATH }}
        filename: ${{ env.CUO_ZIP_NAME }}
        exclusions: '*.zip'

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tuo-legacy-net472
        path: ${{ env.CUO_OUTPUT_PATH }}/${{ env.CUO_ZIP_NAME }}
        retention-days: 30

  notify:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || github.ref }}
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          BRANCH="${{ inputs.branch || github.ref_name }}"
          echo "DATE=$(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_OUTPUT

          LAST_SHA=$(gh api "/repos/${{ github.repository }}/actions/workflows/net472-deploy.yml/runs?status=success&per_page=1&branch=${BRANCH}" \
            --jq '.workflow_runs[0].head_sha' 2>/dev/null || echo "")

          if [ -z "$LAST_SHA" ] || [ "$LAST_SHA" = "null" ]; then
            LOG=$(git log --oneline -20 --format='• %h %s' 2>/dev/null || echo "(no commits)")
          else
            LOG=$(git log --oneline "${LAST_SHA}..HEAD" --format='• %h %s' 2>/dev/null || echo "(no new commits)")
          fi

          echo "LOG<<EOF" >> $GITHUB_OUTPUT
          echo "$LOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Discord notification
        uses: tsickert/discord-webhook@v7.0.0
        continue-on-error: true
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_NET472 }}
          content: |
            **TazUO Legacy (net472) build complete**
            🕐 ${{ steps.notes.outputs.DATE }}
            📦 [Download artifacts](<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}>)

            **Commits since last build:**
            ${{ steps.notes.outputs.LOG }}
