name: TUO-Deploy

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build (default: dev)'
        required: true
        default: 'dev'

env:
  CUO_OUTPUT_PATH: 'build/dist'
  CUO_PROJECT_PATH: "src/ClassicUO.Client/ClassicUO.Client.csproj"

  DOTNET_NOLOGO: false
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  NUGET_XMLDOC_MODE: skip

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Get submodules
        run: |
          git config --global url."https://".insteadOf git://
          git submodule update --init --recursive

      - name: Extract Version
        shell: bash
        id: version
        run: |
          export LC_ALL=C.UTF-8
          VERSION=$(grep -oP '<AssemblyVersion>\K\d+\.\d+\.\d+' src/ClassicUO.Client/ClassicUO.Client.csproj)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10

      - name: Build executable
        run: dotnet publish ${{ env.CUO_PROJECT_PATH }} -c Release -o ${{ env.CUO_OUTPUT_PATH }} -r ${{ matrix.rid }}

      - name: Zip build
        shell: bash
        run: |
          mkdir -p flat

          for d in "${{ env.CUO_OUTPUT_PATH }}" "${{ env.CUO_OUTPUT_PATH }}-Lib"; do
            [ -d "$d" ] || continue

            find "$d" \( -name '*.dSYM' -o -name '*.dSYM/' \) -prune -o -type f -print |
            while IFS= read -r file; do
              dest="flat/${file#$d/}"
              mkdir -p "$(dirname "$dest")"
              cp "$file" "$dest"
            done
          done

          cd flat

          if [[ "$RUNNER_OS" == "Windows" ]]; then
            pwsh -Command "Compress-Archive -Path * -DestinationPath ../${{ matrix.rid }}.zip -Force"
          else
            zip -r ../${{ matrix.rid }}.zip .
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tuo-${{ matrix.rid }}
          path: ${{ matrix.rid }}.zip
          retention-days: 30

  notify:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || github.ref }}
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          BRANCH="${{ inputs.branch || github.ref_name }}"
          echo "DATE=$(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_OUTPUT

          # Get the last successful run's head commit (excluding this run)
          LAST_SHA=$(gh api "/repos/${{ github.repository }}/actions/workflows/tuo-deploy.yml/runs?status=success&per_page=1&branch=${BRANCH}" \
            --jq '.workflow_runs[0].head_sha' 2>/dev/null || echo "")

          if [ -z "$LAST_SHA" ] || [ "$LAST_SHA" = "null" ]; then
            LOG=$(git log --oneline -20 --format='• %h %s' 2>/dev/null || echo "(no commits)")
          else
            LOG=$(git log --oneline "${LAST_SHA}..HEAD" --format='• %h %s' 2>/dev/null || echo "(no new commits)")
          fi

          echo "LOG<<EOF" >> $GITHUB_OUTPUT
          echo "$LOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Discord notification
        uses: tsickert/discord-webhook@v7.0.0
        continue-on-error: true
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_NET10 }}
          content: |
            **TazUO build complete**
            🕐 ${{ steps.notes.outputs.DATE }}
            📦 [Download artifacts](<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}>)

            **Commits since last build:**
            ${{ steps.notes.outputs.LOG }}
